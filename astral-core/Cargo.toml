[package]
name = "astral-core"
version = "0.1.0"
edition = "2021"
authors = ["Aryan Sharma"]
license = "AGPL-3.0"
description = "High-performance air-gapped cryptographic transactional mesh engine."

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "astral_core"

[dependencies]
# Cryptography
p256 = { version = "0.13", features = ["ecdh", "ecdsa", "arithmetic"] }
chacha20poly1305 = { version = "0.10", features = ["alloc"] }
blake3 = "1.5"
rand_core = { version = "0.6", features = ["getrandom"] }
hkdf = "0.12"
sha2 = "0.10"

# Serialization & Zero-Copy Primitives
bytes = "1.5"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }

# Concurrency & In-Memory State
parking_lot = "0.12"
thiserror = "1.0"

# FFI Framework
uniffi = { version = "0.28", features = ["cli"] }

[features]
default = []
